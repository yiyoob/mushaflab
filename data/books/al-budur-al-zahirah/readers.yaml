  - {form: "القراء العشرة", cite: "page_1_0001 p. 5 (first use)"}
  - {form: "اتفق", cite: "page_1_0007 p. 11 (first use)"}
  - {form: "اتفقوا", cite: "page_1_0119 p. 123 (first use)"}
  - {form: "أجمع", cite: "page_1_0002 p. 6 (first use)"}
  - {form: "أجمعوا", cite: "page_1_0011 p. 15 (first use)"}
