  - {form: "بخلف عنهم", attach: all, cite: "page_1_0152 p. 156 (first use)"}
  - {form: "بخلاف عنه", attach: last, cite: "page_1_0013 p. 17 (first use)"}
  - {form: "بخلاف عنهما", attach: last_two, cite: "page_1_0013 p. 17 (first use)"}
  - {form: "بخلف", attach: last, cite: "page_1_0003 p. 7 (first use)"}
  - {form: "بخلاف", attach: last, cite: "page_1_0007 p. 11 (first use)"}
  - {form: "بالخلاف", attach: last, cite: "page_1_0021 p. 25 (first use)"}
