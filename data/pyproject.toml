[project]
name = "mushaf-data"
version = "0.0.0"
description = "Offline data pipeline for the multi-qiraat mushaf"
requires-python = "==3.12.*"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "brotli>=1.1",
    "fonttools>=4.67.0",
    "pymupdf>=1.26",
    "pytest",
    "pytest-xdist>=3.6",
    "ruff",
    "uharfbuzz>=0.56.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "N", "PL", "ANN"]
ignore = ["S603", "S607"]  # subprocess with fixed git arguments is expected

[tool.ruff.lint.per-file-ignores]
"pipeline/tests/*" = ["S101", "PLR2004", "ANN"]
# Exploratory Phase 0 spikes: report-generating scripts, not pipeline code.
"spikes/*" = ["PLR2004", "PLR0912", "PLR0915"]
# al-Futuh glyph-level extraction (pipeline/futuh): geometry thresholds in PDF points are
# documented where used; the page/label parsers are long by nature; heavy modules (pymupdf,
# uharfbuzz) and the spine are imported where first needed.
"pipeline/futuh/*" = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLC0415"]
# the QA page is an inline HTML/CSS template
"pipeline/futuh/emit.py" = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLC0415", "E501"]
