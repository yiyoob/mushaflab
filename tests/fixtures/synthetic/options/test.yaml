# Synthetic option groups.
- id: "test.toggle"
  title_ar: "test toggle"
  choices: ["off", "on"]
  defaults:
    - {riwayah: "r1", choice: "off"}
    - {riwayah: "r1", tariq: "t2", choice: "on"}
    - {riwayah: "r3", choice: "off"}
  affects: ["r1.opt.on", "r3.toggle"]
  allowed_for: ["r1"]
- id: "test.other"
  title_ar: "test other"
  choices: ["a", "b", "c"]
- id: "r3.tariq"
  title_ar: "test tariq"
  choices: ["t1", "t2"]
  defaults:
    - {riwayah: "r3", choice: "t1"}
