name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Owner-only paths are owner-signed (rule 4)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="$BASE..$SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$SHA"
          else range="$BEFORE..$SHA"; fi
          .github/scripts/check-approvals.sh "$range"
      - name: Install tools
        run: brew install rustup uv just
      - name: Rust toolchain (version from rust-toolchain.toml)
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/rustup/bin/rustup show active-toolchain || /opt/homebrew/opt/rustup/bin/rustup toolchain install
      - name: Python
        run: uv python install 3.12 && uv sync --directory data --locked
      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: data/sources/raw
          key: sources-${{ hashFiles('data/sources/MANIFEST.json') }}
      - name: Fetch and verify pinned sources
        run: just data-fetch
      - name: Build data and require tracked files to be current
        run: |
          just data-build
          git diff --exit-code
      - name: Lint and test
        env:
          MUSHAF_REQUIRE_SOURCES: "1"
        run: just lint core-test core-targets data-test data-verify
      - name: Round-trip raw patches vs KFGQPC (T4.6, D22)
        env:
          MUSHAF_REQUIRE_SOURCES: "1"
        run: just roundtrip
