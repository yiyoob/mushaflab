# Switched off in the repository's Actions settings (owner, 2026-11-23): `just gate`, run
# locally before every merge, is the full check. Kept current so it can be switched back on.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: brew install rustup uv just
      - name: Rust toolchain (version from rust-toolchain.toml)
        run: |
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/rustup/bin/rustup show active-toolchain || /opt/homebrew/opt/rustup/bin/rustup toolchain install
      - name: Python
        run: uv python install 3.12 && uv sync --directory data --locked
      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: data/sources/raw
          key: sources-${{ hashFiles('data/sources/MANIFEST.json') }}
      - name: Fetch and verify pinned sources
        run: just data-fetch
      - name: Build data and require tracked files to be current
        run: |
          just data-build
          git diff --exit-code
      - name: cargo-nextest and wasm-bindgen-cli (cached)
        id: cargo-bin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/wasm-bindgen
          key: cargo-bin-${{ runner.os }}-nextest-0.9.152-wasm-bindgen-0.2.129
      - name: Install cargo-nextest and wasm-bindgen-cli
        if: steps.cargo-bin.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-nextest --version 0.9.152
          cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Lint and test (every riwayah, MUSHAF_FULL)
        env:
          MUSHAF_REQUIRE_SOURCES: "1"
          MUSHAF_FULL: "1"
        run: just lint core-test core-targets data-test data-verify
      - name: Goldens, line fit and shaping integrity on all 604 pages (T3.5, T3.5a)
        env:
          MUSHAF_REQUIRE_SOURCES: "1"
        run: just golden
      - name: Round-trip raw patches vs KFGQPC (T4.6, D22)
        env:
          MUSHAF_REQUIRE_SOURCES: "1"
        run: just roundtrip
      # The web checks of `just gate` (T8.1, T8.3, T8.5), so CI runs the whole gate.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Web app dependencies and Chromium
        run: just web-setup
      - name: Web gate (WASM parity, typecheck, Playwright screens and goldens)
        env:
          MUSHAF_REQUIRE_SOURCES: "1"
        run: just web-gate
