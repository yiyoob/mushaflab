# The KFGQPC Madinah writing convention (D72), as far as the Hafs text shows it.
# Generated by `python -m pipeline.corpus_dabt write` from corpus/text/words.tsv,
# except the signs section at the end, which is written by hand. Do not edit above it.
id: kfgqpc-madinah
title: "KFGQPC Madinah conventions, from the KFGQPC Hafs text v2.0"
letters: 328135
mark_order:
  source: kfgqpc-hafs:all
  status: raw-derived
  note: >-
    The order in which the Hafs text writes marks on a letter; a pair seen in both
    orders takes the majority, and the letters written the other way are exceptions.
  order: ["U+0652", "U+0654", "U+0655", "U+06E0", "U+06E1", "U+06DC", "U+06E7", "U+0651", "U+064B", "U+064C", "U+064D", "U+064E", "U+064F", "U+0650", "U+0656", "U+0657", "U+065E", "U+0670", "U+0653", "U+06D8", "U+06DB", "U+06E2", "U+06D7", "U+06E4", "U+06E8", "U+06EA", "U+06EC", "U+06ED", "U+06D6", "U+06DA"]
  exceptions:
    - {letter: "7:69:22:2", marks: ["U+06DC", "U+06E1"]}
# --- signs: written by hand, one cited row per sign (D72 level b, M1.2) ---
# Each row: what one mark means in this style, cited to the sign explanation pages of the KFGQPC
# Madinah Hafs mushaf (source kfgqpc-hafs-explanation, page letters transliterated). Which
# codepoint the printed sign is was linked through the page's own examples: `evidence` lists
# those example words, and `mushaf check` verifies each carries the codepoint. Rows the pages do
# not explain are `hypothesis` (G-226). Review sheet: docs/review/m1/sign-links.md.
signs:
  # Vowels, shadda and hamza: used throughout the pages, never defined there.
  - id: fatha
    codepoint: "U+064E"
    features: [fatha]
    source: "kfgqpc-hafs:all"
    status: hypothesis
    note: "the explanation pages do not define the vowel signs"
  - id: damma
    codepoint: "U+064F"
    features: [damma]
    source: "kfgqpc-hafs:all"
    status: hypothesis
    note: "the explanation pages do not define the vowel signs"
  - id: kasra
    codepoint: "U+0650"
    features: [kasra]
    source: "kfgqpc-hafs:all"
    status: hypothesis
    note: "the explanation pages do not define the vowel signs"
  - id: shadda
    codepoint: "U+0651"
    features: [shadda]
    source: "kfgqpc-hafs-explanation:pdal"
    status: hypothesis
    note: >-
      p. dal uses the shadda of the next letter to mark idgham after an unmarked letter, but does
      not define the shadda itself
  - id: hamza_above
    codepoint: "U+0654"
    features: [hamza_above]
    source: "kfgqpc-hafs:all"
    status: hypothesis
    note: "not explained on the pages"
  - id: hamza_below
    codepoint: "U+0655"
    features: [hamza_below]
    source: "kfgqpc-hafs:all"
    status: hypothesis
    note: "not explained on the pages"
  # Zero signs and sukun.
  - id: zero_round
    codepoint: "U+0652"
    features: [not_pronounced]
    evidence: ["98:2:4", "27:21:5"]
    source: "kfgqpc-hafs-explanation:pjim"
    status: raw-derived
    note: >-
      round hollow circle over one of the three weak letters added in the rasm: not pronounced in
      wasl or waqf (examples: yatlu suhufan, la-adhbahannahu)
  - id: zero_oblong
    codepoint: "U+06E0"
    features: [dropped_in_wasl]
    bases: ["U+0627"]
    evidence: ["7:12:9", "38:76:2", "18:38:1"]
    source: "kfgqpc-hafs-explanation:pjim ; kfgqpc-hafs-explanation:pdal"
    status: raw-derived
    note: >-
      upright oblong hollow circle over an alif followed by a voweled letter: added in wasl only,
      pronounced in waqf (ana khayrun minhu, lakinna huwa allahu rabbi); an alif followed by a
      vowelless letter is left unmarked (ana al-nadhir, 15:89:3, which carries no mark)
  - id: sukun
    codepoint: "U+06E1"
    features: [vowelless, izhar]
    evidence: ["26:136:4", "58:1:1", "4:56:9", "46:29:1", "2:105:13"]
    source: "kfgqpc-hafs-explanation:pdal"
    status: raw-derived
    note: >-
      head of a small kha without its dot: the letter is vowelless and pronounced clearly (izhar);
      a letter left without it before a letter with shadda is fully assimilated, before one without
      shadda partly assimilated or hidden (p. dal; absence of a mark, so no row)
  # Tanwin: stacked (izhar) or consecutive (idgham or ikhfa'), p. dal and p. ha.
  - id: tanwin_fath_stacked
    codepoint: "U+064B"
    features: [tanwin_fath, tanwin_izhar]
    evidence: ["17:44:20"]
    source: "kfgqpc-hafs-explanation:pdal"
    status: raw-derived
    note: "the two vowels stacked mark izhar of the tanwin (halim-an ghafur-an)"
  - id: tanwin_damm_stacked
    codepoint: "U+064C"
    features: [tanwin_damm, tanwin_izhar]
    evidence: ["9:128:10"]
    source: "kfgqpc-hafs-explanation:pdal"
    status: raw-derived
    note: "stacked, izhar (harisun 'alaykum)"
  - id: tanwin_kasr_stacked
    codepoint: "U+064D"
    features: [tanwin_kasr, tanwin_izhar]
    evidence: ["13:7:14", "13:7:15"]
    source: "kfgqpc-hafs-explanation:pdal"
    status: raw-derived
    note: "stacked, izhar (wa-li-kulli qawmin hadin)"
  - id: tanwin_fath_consecutive
    codepoint: "U+0657"
    features: [tanwin_fath, tanwin_not_izhar]
    evidence: ["17:12:11", "16:15:8", "16:15:9", "50:44:5"]
    source: "kfgqpc-hafs-explanation:pha"
    status: raw-derived
    note: >-
      the two vowels one after the other: full idgham when the next letter has shadda, partial
      idgham or ikhfa' when it does not (mubsiratan li-tabtaghu; wa-anharan wa-subulan; sira'an
      dhalika). The KFGQPC text writes this sign as U+0657.
  - id: tanwin_damm_consecutive
    codepoint: "U+065E"
    features: [tanwin_damm, tanwin_not_izhar]
    evidence: ["9:128:13", "11:90:8", "11:90:9", "37:10:6", "37:10:7"]
    source: "kfgqpc-hafs-explanation:pha"
    status: raw-derived
    note: "consecutive, as above (ra'ufun rahim; rahimun wadud; shihabun thaqib); written U+065E"
  - id: tanwin_kasr_consecutive
    codepoint: "U+0656"
    features: [tanwin_kasr, tanwin_not_izhar]
    evidence: ["88:8:2", "80:16:2"]
    source: "kfgqpc-hafs-explanation:pha"
    status: raw-derived
    note: "consecutive, as above (yawma'idhin na'imah); written U+0656"
  # Iqlab.
  - id: iqlab_above
    codepoint: "U+06E2"
    features: [iqlab]
    without: [kasra]
    evidence: ["3:119:25", "5:38:5"]
    source: "kfgqpc-hafs-explanation:pha"
    status: raw-derived
    note: >-
      small mim in place of the tanwin's second vowel, or over a vowelless nun in place of the
      sukun, before a ba without shadda: iqlab ('alimun bi-dhat al-sudur; jaza'an bima)
  - id: iqlab_below
    codepoint: "U+06ED"
    features: [iqlab]
    with: [kasra]
    evidence: ["80:16:1"]
    source: "kfgqpc-hafs-explanation:pha"
    status: raw-derived
    note: "the same small mim, under a letter with kasra (kiramin bararah)"
  # Small letters (omitted in the rasm, pronounced).
  - id: small_alef
    codepoint: "U+0670"
    features: [small_letter_alef]
    evidence: ["2:2:1", "2:2:2", "2:3:5", "24:35:7", "2:275:3"]
    source: "kfgqpc-hafs-explanation:pha ; kfgqpc-hafs-explanation:pwaw"
    status: raw-derived
    note: >-
      small letters mark letters left out of the Uthmani rasm that must be pronounced (dhalika
      al-kitab); over a letter written in its place, the small letter is pronounced, not the
      written one (al-salah, ka-mishkah, al-riba; p. waw)
  - id: small_high_yeh
    codepoint: "U+06E7"
    features: [small_letter_yeh]
    source: "kfgqpc-hafs-explanation:pha"
    status: raw-derived
    note: "covered by the general statement on small letters (p. ha); no example of this codepoint on the page"
  - id: small_high_noon
    codepoint: "U+06E8"
    features: [small_letter_noon]
    evidence: ["21:88:7"]
    source: "kfgqpc-hafs-explanation:pha"
    status: raw-derived
    note: "small nun (wa-kadhalika nunji al-mu'minin)"
  # Madd, imalah, ishmam, tas-hil, the sin over sad, sakt.
  - id: madd
    codepoint: "U+0653"
    features: [madd_beyond_natural]
    evidence: ["79:34:3", "30:13:6"]
    source: "kfgqpc-hafs-explanation:pwaw"
    status: raw-derived
    note: >-
      over a letter: its madd is held longer than the natural madd (al-tammah, shufa'a'u); not used
      for an alif dropped after a written alif (p. waw)
  - id: sin_over_sad
    codepoint: "U+06DC"
    features: [sin_for_sad]
    bases: ["U+0635"]
    at: ["2:245:14", "7:69:22"]
    evidence: ["2:245:14", "7:69:22"]
    source: "kfgqpc-hafs-explanation:pwaw"
    status: raw-derived
    note: "sin over the sad of yabsutu and bastatan: Hafs by al-Shatibiyyah reads it with sin"
  - id: sin_under_sad
    codepoint: "U+06DC"
    features: [sad_preferred]
    bases: ["U+0635"]
    at: ["52:37:7"]
    evidence: ["52:37:7"]
    source: "kfgqpc-hafs-explanation:pwaw"
    status: raw-derived
    note: >-
      sin under the sad of al-musaytirun: the sad is the better-known reading; the KFGQPC text
      writes this sign as U+06DC as well (its font places it). bi-musaytir (al-Ghashiyah) is sad
      only for Hafs by al-Shatibiyyah and carries no sin
  - id: sakt
    codepoint: "U+06DC"
    features: [sakt]
    at: ["18:1:11", "36:52:6", "69:28:4", "75:27:2", "83:14:2"]
    evidence: ["18:1:11", "36:52:6", "69:28:4", "75:27:2", "83:14:2"]
    source: "kfgqpc-hafs-explanation:phha ; kfgqpc-hafs-explanation:ptta"
    status: raw-derived
    note: >-
      sin over the last letter: a short pause without breath when continuing (Hafs by
      al-Shatibiyyah: 'iwaja, marqadina, man raq, bal ran; and maliyah, written with izhar and sakt)
  - id: imalah
    codepoint: "U+06EA"
    features: [imalah]
    at: ["11:41:6"]
    evidence: ["11:41:6"]
    source: "kfgqpc-hafs-explanation:pwaw"
    status: raw-derived
    note: "large dot under the letter in place of the fatha: al-imalah al-kubra (majraha, Hud)"
  - id: ishmam
    codepoint: "U+06EC"
    features: [ishmam]
    at: ["12:11:6"]
    evidence: ["12:11:6"]
    source: "kfgqpc-hafs-explanation:pwaw ; kfgqpc-hafs-explanation:pzay"
    status: raw-derived
    note: >-
      the dot over the end of the mim before the doubled nun of ta'manna: ishmam; the word is
      written to suit both wujuh (ishmam and ikhfa'), p. zay
  - id: tashil
    codepoint: "U+06EC"
    features: [tashil]
    at: ["41:44:9"]
    evidence: ["41:44:9"]
    source: "kfgqpc-hafs-explanation:pzay"
    status: raw-derived
    note: "the same dot without a vowel in place of the hamza: tas-hil bayna bayna (a'jamiyyun, Fussilat)"
  # Sajdah and hizb.
  - id: sajdah_word
    codepoint: "U+06E4"
    features: [sajdah_word]
    evidence: ["13:15:1", "53:62:1"]
    source: "kfgqpc-hafs-explanation:phha"
    status: raw-derived
    note: >-
      a horizontal line over a word: the word that calls for the sajdah. The KFGQPC text writes it
      as U+06E4 on the word's letters; all 15 places sit in the ayah of a sajdah sign or up to two
      ayahs before it (checked in data/pipeline/tests/test_corpus_dabt.py)
  - id: sajdah_place
    codepoint: "U+06E9"
    features: [sajdah_place]
    evidence: ["7:206:11", "13:15:11"]
    source: "kfgqpc-hafs-explanation:phha"
    status: raw-derived
    note: "the sign after a word marks the place of the sajdah"
  - id: hizb_start
    codepoint: "U+06DE"
    features: [hizb_start]
    evidence: ["2:26:0"]
    source: "kfgqpc-hafs-explanation:phha"
    status: raw-derived
    note: "marks the start of the juz', hizb, and their halves and quarters"
  # Stop signs, p. lam.
  - id: waqf_lazim
    codepoint: "U+06D8"
    features: [waqf_lazim]
    evidence: ["6:36:4"]
    source: "kfgqpc-hafs-explanation:plam"
    status: raw-derived
    note: "mim, the necessary stop (yasma'un, wa-al-mawta)"
  - id: waqf_jaiz
    codepoint: "U+06DA"
    features: [waqf_jaiz]
    evidence: ["18:13:5"]
    source: "kfgqpc-hafs-explanation:plam"
    status: raw-derived
    note: "jim, stopping and continuing equally allowed (bi-al-haqq, innahum fityatun)"
  - id: wasl_awla
    codepoint: "U+06D6"
    features: [wasl_awla]
    evidence: ["6:17:9"]
    source: "kfgqpc-hafs-explanation:plam"
    status: raw-derived
    note: "sad-lam-ya, stopping allowed, continuing better (illa huwa, wa-in)"
  - id: waqf_awla
    codepoint: "U+06D7"
    features: [waqf_awla]
    evidence: ["18:22:22"]
    source: "kfgqpc-hafs-explanation:plam"
    status: raw-derived
    note: "qaf-lam-ya, stopping allowed, stopping better (illa qalilun, fa-la)"
  - id: waqf_muanaqah
    codepoint: "U+06DB"
    features: [waqf_muanaqah]
    evidence: ["2:2:4", "2:2:5"]
    source: "kfgqpc-hafs-explanation:plam"
    status: raw-derived
    note: "three dots, the embracing stop: stop at one of the two places, not both (la rayba fihi)"
