[workspace]
resolver = "3"
members = [
    "mushaf-model",
    "mushaf-db",
    "mushaf-resolve",
    "mushaf-rules",
    "mushaf-layout",
    "mushaf-shape",
    "mushaf-justify",
    "mushaf-draw",
    "mushaf-engine",
    "mushaf-render-cli",
    "mushaf-ffi",
    "mushaf-wasm",
    "mushaf-roundtrip",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
mushaf-model = { path = "mushaf-model" }
mushaf-resolve = { path = "mushaf-resolve" }
mushaf-rules = { path = "mushaf-rules" }
mushaf-layout = { path = "mushaf-layout" }
mushaf-shape = { path = "mushaf-shape" }
mushaf-justify = { path = "mushaf-justify" }
mushaf-draw = { path = "mushaf-draw" }
mushaf-db = { path = "mushaf-db" }
mushaf-engine = { path = "mushaf-engine" }
# Third-party versions are pinned exactly (determinism, reproducible builds).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize", "serialize"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
sha2 = "=0.11.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
# Shaping (D3): pinned exactly; read-fonts is the version harfrust itself uses.
harfrust = "=0.14.0"
read-fonts = { version = "=0.45.1", default-features = false, features = ["std"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode-perl"] }
# Host only (reference renderer): SVG to PNG, no text or system fonts (pages are all paths).
resvg = { version = "=0.48.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Third-party crates are optimized in dev and test builds: the YAML parser reads ~80 MB of
# raw patch files in the data tests (D20). Workspace crates keep debug settings.
[profile.dev.package."*"]
opt-level = 2
