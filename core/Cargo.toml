[workspace]
resolver = "3"
members = [
    "mushaf-model",
    "mushaf-db",
    "mushaf-resolve",
    "mushaf-rules",
    "mushaf-layout",
    "mushaf-shape",
    "mushaf-justify",
    "mushaf-draw",
    "mushaf-render-cli",
    "mushaf-ffi",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
mushaf-model = { path = "mushaf-model" }
mushaf-resolve = { path = "mushaf-resolve" }
mushaf-rules = { path = "mushaf-rules" }
mushaf-layout = { path = "mushaf-layout" }
mushaf-shape = { path = "mushaf-shape" }
mushaf-justify = { path = "mushaf-justify" }
mushaf-draw = { path = "mushaf-draw" }
mushaf-db = { path = "mushaf-db" }
# Third-party versions are pinned exactly (determinism, reproducible builds).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize", "serialize"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
sha2 = "=0.11.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
