[workspace]
resolver = "3"
members = [
    "mushaf-model",
    "mushaf-resolve",
    "mushaf-rules",
    "mushaf-layout",
    "mushaf-shape",
    "mushaf-justify",
    "mushaf-draw",
    "mushaf-render-cli",
    "mushaf-ffi",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
mushaf-model = { path = "mushaf-model" }
mushaf-resolve = { path = "mushaf-resolve" }
mushaf-rules = { path = "mushaf-rules" }
mushaf-layout = { path = "mushaf-layout" }
mushaf-shape = { path = "mushaf-shape" }
mushaf-justify = { path = "mushaf-justify" }
mushaf-draw = { path = "mushaf-draw" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
